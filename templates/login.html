<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - PC Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="bg-slate-800 p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-2xl font-bold text-white mb-1">PC Monitor</h1>
    <p class="text-slate-400 mb-6 text-sm">Masuk ke dashboard admin</p>

    {% if error %}
    <div class="bg-red-500/20 text-red-300 text-sm px-3 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="text-slate-300 text-sm block mb-1">Username</label>
        <input name="username" type="text" required
          class="w-full px-3 py-2 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="text-slate-300 text-sm block mb-1">Password</label>
        <input name="password" type="password" required
          class="w-full px-3 py-2 rounded bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">
        Masuk
      </button>
    </form>
  </div>
</body>
</html>
